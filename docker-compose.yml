services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: registry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d registry"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    volumes:
      - ./data:/app/data:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/registry
      JWT_SECRET: change-me-in-production-please
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
      ADMIN_DEPARTMENT: Администрация
      CSV_SOURCE_PATH: /app/data/fake_source.csv
      SYNC_INTERVAL_HOURS: "6"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: